version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chainalyze
      POSTGRES_PASSWORD: chainalyze
      POSTGRES_DB: chainalyze
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8001 --reload
    env_file: .env.example
    depends_on: [db, redis]
    ports: ["8001:8001"]

  worker:
    build: .
    command: celery -A apps.worker.celery_app.celery_app worker -B --loglevel=INFO
    env_file: .env.example
    depends_on: [db, redis]

  ui:
    build: .
    command: streamlit run apps/ui/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env.example
    depends_on: [api]
    ports: ["8501:8501"]

volumes:
  pg_data:
