[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainalyze"
version = "0.1.0"
description = "CHAiNALYZE modular crypto market intelligence MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "ccxt>=4.4",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "ta>=0.11",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "streamlit>=1.38",
  "plotly>=5.24",
  "psycopg2-binary>=2.9",
  "pytest>=8.3",
  "black>=24.8",
  "ruff>=0.6",
  "cryptography>=43.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["apps", "packages"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
